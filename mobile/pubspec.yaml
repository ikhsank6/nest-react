name: nest_react_mobile
description: Mobile app for NestJS React project with login, home, and profile features.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_bloc: ^8.1.3
  flutter_secure_storage: ^9.2.2
  equatable: ^2.0.5
  go_router: ^14.6.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  formz: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
